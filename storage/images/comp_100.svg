<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e38"/>
      <stop offset="50%" stop-color="#006266"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#0f141d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="480" rx="16" fill="url(#bg)"/>
  <rect x="6" y="6" width="348" height="468" rx="12" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4"/>

  <!-- PCB Grid Pattern Accent -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="20" y1="40" x2="340" y2="40"/>
    <line x1="20" y1="80" x2="340" y2="80"/>
    <line x1="20" y1="120" x2="340" y2="120"/>
    <line x1="20" y1="160" x2="340" y2="160"/>
    <line x1="20" y1="200" x2="340" y2="200"/>
    <line x1="60" y1="20" x2="60" y2="220"/>
    <line x1="120" y1="20" x2="120" y2="220"/>
    <line x1="180" y1="20" x2="180" y2="220"/>
    <line x1="240" y1="20" x2="240" y2="220"/>
    <line x1="300" y1="20" x2="300" y2="220"/>
  </g>

  <!-- Top Category Tag -->
  <rect x="24" y="22" width="160" height="24" rx="6" fill="#00f2fe" fill-opacity="0.2"/>
  <text x="32" y="38" fill="#00f2fe" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1.2">DISPLAY / MOTOR</text>

  <!-- ID Badge -->
  <text x="336" y="38" text-anchor="end" fill="#747d8c" font-family="Arial, sans-serif" font-size="12" font-weight="bold">#100</text>

  <!-- Center Component IC Emblem -->
  <g transform="translate(180, 140)">
    <rect x="-70" y="-70" width="140" height="140" rx="16" fill="url(#chip)" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>
    <!-- IC Pins Left/Right -->
    <rect x="-82" y="-50" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="-82" y="-30" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="-82" y="-10" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="-82" y="10" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="-82" y="30" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="70" y="-50" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="70" y="-30" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="70" y="-10" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="70" y="10" width="12" height="6" rx="2" fill="#dcdde1"/>
    <rect x="70" y="30" width="12" height="6" rx="2" fill="#dcdde1"/>
    <!-- Center Icon -->
    <text x="0" y="16" text-anchor="middle" font-size="48">📟</text>
  </g>

  <!-- Component Tier Badge -->
  <text x="180" y="245" text-anchor="middle" fill="#a4b0be" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">STANDARD LAB GRADE</text>

  <!-- Name Card Box -->
  <rect x="20" y="265" width="320" height="195" rx="10" fill="#0b0f19" fill-opacity="0.9" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Component Name (Wrapped / Scaled) -->
  <text x="180" y="300" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">
    28BYJ-48 5V Stepper Motor + UL...
  </text>
  <text x="180" y="322" text-anchor="middle" fill="#00f2fe" font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    Display &amp; Actuator
  </text>

  <line x1="40" y1="340" x2="320" y2="340" stroke="rgba(255,255,255,0.1)"/>

  <!-- Specs / Manufacturer -->
  <text x="40" y="365" fill="#747d8c" font-family="Arial, sans-serif" font-size="11">MANUFACTURER / ARCH</text>
  <text x="40" y="385" fill="#f1f2f6" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Generic Robotics</text>

  <!-- Base Price -->
  <text x="320" y="365" text-anchor="end" fill="#747d8c" font-family="Arial, sans-serif" font-size="11">BASE AUCTION PRICE</text>
  <text x="320" y="390" text-anchor="end" fill="#2ed573" font-family="Arial, sans-serif" font-size="20" font-weight="bold">₹45L</text>

  <!-- Footer Tag -->
  <text x="180" y="440" text-anchor="middle" fill="#57606f" font-family="Arial, sans-serif" font-size="10" letter-spacing="1">ECE HARDWARE AUCTION 2026</text>
</svg>